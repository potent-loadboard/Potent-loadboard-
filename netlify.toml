[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/manage-posting"
  to = "/.netlify/functions/manage-posting"
  status = 200

[[redirects]]
  from = "/api/my-postings"
  to = "/.netlify/functions/my-postings"
  status = 200

[[redirects]]
  from = "/api/admin-actions"
  to = "/.netlify/functions/admin-actions"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
