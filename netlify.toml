[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/master-webhook"
  status = 200

[[redirects]]
  from = "/api/create-poster-subscription"
  to = "/.netlify/functions/create-poster-subscription"
  status = 200

[[redirects]]
  from = "/api/create-driver-access"
  to = "/.netlify/functions/create-driver-access"
  status = 200

[[redirects]]
  from = "/api/check-driver-access"
  to = "/.netlify/functions/check-driver-access"
  status = 200

[[redirects]]
  from = "/api/send-message"
  to = "/.netlify/functions/send-message"
  status = 200

[[redirects]]
  from = "/api/manage-posting"
  to = "/.netlify/functions/manage-posting"
  status = 200

[[redirects]]
  from = "/api/my-postings"
  to = "/.netlify/functions/my-postings"
  status = 200

[[redirects]]
  from = "/api/admin-actions"
  to = "/.netlify/functions/admin-actions"
  status = 200

[[redirects]]
  from = "/api/flag-posting"
  to = "/.netlify/functions/flag-posting"
  status = 200

[[redirects]]
  from = "/api/renew-posting"
  to = "/.netlify/functions/renew-posting"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
